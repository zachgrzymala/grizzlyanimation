# GitHub Pages build settings.
#
# There must be NO .nojekyll file in this repo. With one present Pages skips
# Jekyll entirely, this file is ignored, and every path below gets published —
# which silently served 90 MB of full-resolution originals from the live site.
# tools/build.py deletes a stray .nojekyll on each build for that reason.
#
# Everything listed here stays in the repository; it is simply not copied into
# the published site at grizzlyanimation.com.
exclude:
  - _masters
  - tools
  - README.md
